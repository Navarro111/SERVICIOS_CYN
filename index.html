<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>SERVTECH_NAVARRO</title>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0a192f, #112240);
    color: #ccd6f6;
    margin: 0;
}

/* HEADER */
.header {
    background: #020c1b;
    padding: 20px;
    text-align: center;
    border-bottom: 2px solid #64ffda;
}

.header h1 {
    margin: 0;
    color: #64ffda;
}

.header p {
    margin: 5px;
    font-size: 14px;
}

/* CONTENEDOR */
.container {
    max-width: 1000px;
    margin: 30px auto;
    background: #112240;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
}

/* INPUTS */
input, select {
    padding: 10px;
    margin: 5px;
    border: none;
    border-radius: 5px;
    background: #0a192f;
    color: white;
}

button {
    padding: 10px 15px;
    margin: 5px;
    background: #64ffda;
    color: #0a192f;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #52d1b2;
}

/* TABLA */
table {
    width: 100%;
    margin-top: 20px;
    border-collapse: collapse;
}

th {
    background: #020c1b;
    color: #64ffda;
}

td, th {
    padding: 10px;
    border-bottom: 1px solid #233554;
    text-align: center;
}

/* FACTURA */
.factura {
    margin-top: 20px;
    background: #020c1b;
    padding: 15px;
    border-left: 5px solid #64ffda;
}

/* BADGE */
.estado {
    padding: 5px 10px;
    border-radius: 5px;
}

.disponible {
    background: #28a745;
}

.ocupado {
    background: #dc3545;
}
</style>

</head>

<body>

<div class="header">
    <h1>💻 SERVTECH_NAVARRO</h1>
    <p>Soluciones Tecnológicas | Alquiler de Equipos | Servicios Digitales</p>
</div>

<div class="container">

<h3>📋 Registro de Alquiler</h3>

<input type="text" id="cliente" placeholder="Nombre del cliente">

<select id="equipo">
    <option value="PC1">PC 1</option>
    <option value="PC2">PC 2</option>
    <option value="Laptop1">Laptop 1</option>
    <option value="Laptop2">Laptop 2</option>
    <option value="Impresora">Impresora</option>
</select>

<input type="number" id="horas" placeholder="Horas">

<button onclick="alquilar()">Registrar</button>

<h3>🖨️ Servicios</h3>

<select id="servicio">
    <option value="impresion">Impresión ($0.10)</option>
    <option value="copia">Copia ($0.05)</option>
</select>

<input type="number" id="cantidad" placeholder="Cantidad">
<button onclick="agregarServicio()">Agregar</button>

<h3>📊 Estado de Equipos</h3>
<div id="estadoEquipos"></div>

<h3>📁 Registros</h3>

<table>
<thead>
<tr>
<th>Cliente</th>
<th>Equipo</th>
<th>Horas</th>
<th>Servicios</th>
<th>Total</th>
<th>Acción</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>

<div class="factura" id="factura"></div>

</div>

<script>

let equipos = {
    "PC1": true,
    "PC2": true,
    "Laptop1": true,
    "Laptop2": true,
    "Impresora": true
};

let registros = [];
let serviciosTemp = [];

// -------- LOCAL STORAGE --------
function guardarDatos() {
    localStorage.setItem("registros", JSON.stringify(registros));
}

function cargarDatos() {
    let data = localStorage.getItem("registros");
    if (data) {
        registros = JSON.parse(data);
        reconstruirEquipos();
        mostrar();
    }
}

// reconstruir estado
function reconstruirEquipos() {
    for (let key in equipos) {
        equipos[key] = true;
    }

    registros.forEach(r => {
        equipos[r.equipo] = false;
    });
}

// -------- FUNCIONES --------
function alquilar() {
    let cliente = document.getElementById("cliente").value;
    let equipo = document.getElementById("equipo").value;
    let horas = parseInt(document.getElementById("horas").value);

    if (!cliente || !horas) {
        alert("Complete los campos");
        return;
    }

    if (!equipos[equipo]) {
        alert("Equipo ocupado");
        return;
    }

    let costo = horas * 5;
    let totalServicios = serviciosTemp.reduce((a, s) => a + s.total, 0);
    let total = costo + totalServicios;

    equipos[equipo] = false;

    registros.push({
        cliente,
        equipo,
        horas,
        servicios: [...serviciosTemp],
        total
    });

    serviciosTemp = [];

    guardarDatos();
    mostrar();
    generarFactura(cliente, equipo, horas, total);
}

function agregarServicio() {
    let tipo = document.getElementById("servicio").value;
    let cantidad = parseInt(document.getElementById("cantidad").value);

    let precio = tipo === "impresion" ? 0.10 : 0.05;

    serviciosTemp.push({
        tipo,
        cantidad,
        total: cantidad * precio
    });

    alert("Servicio agregado");
}

function mostrar() {
    let tabla = document.getElementById("tabla");
    tabla.innerHTML = "";

    registros.forEach((r, i) => {
        let servicios = r.servicios.map(s => s.tipo + "(" + s.cantidad + ")").join(", ");

        tabla.innerHTML += `
        <tr>
            <td>${r.cliente}</td>
            <td>${r.equipo}</td>
            <td>${r.horas}</td>
            <td>${servicios}</td>
            <td>$${r.total.toFixed(2)}</td>
            <td><button onclick="eliminar(${i})">Eliminar</button></td>
        </tr>
        `;
    });

    mostrarEstado();
}

function eliminar(i) {
    equipos[registros[i].equipo] = true;
    registros.splice(i, 1);

    guardarDatos();
    mostrar();
}

// -------- ESTADO VISUAL --------
function mostrarEstado() {
    let div = document.getElementById("estadoEquipos");
    div.innerHTML = "";

    for (let e in equipos) {
        let estado = equipos[e] ? "Disponible" : "Ocupado";
        let clase = equipos[e] ? "disponible" : "ocupado";

        div.innerHTML += `<span class="estado ${clase}">${e}: ${estado}</span> `;
    }
}

// -------- FACTURA --------
function generarFactura(cliente, equipo, horas, total) {
    document.getElementById("factura").innerHTML = `
        <h3>🧾 Factura SERVTECH_NAVARRO</h3>
        Cliente: ${cliente} <br>
        Equipo: ${equipo} <br>
        Horas: ${horas} <br>
        Total: $${total.toFixed(2)}
    `;
}

// -------- INIT --------
window.onload = cargarDatos;

</script>

</body>
</html>
